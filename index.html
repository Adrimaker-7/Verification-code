<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web de Tareas</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.caja {
    background: white;
    color: #222;
    width: 90%;
    max-width: 500px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
    margin-top: 0;
    font-size: 32px;
}

.descripcion {
    color: #666;
    font-size: 17px;
}

/* CUADRADO NO SOY UN ROBOT */

.robot {
    background: #f5f5f5;
    color: #222;
    padding: 15px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    width: fit-content;
    margin: 25px auto;
    font-size: 16px;
    border: 1px solid #ddd;
}

.robot input {
    width: 22px;
    height: 22px;
    cursor: pointer;
}

/* CÓDIGO */

.codigo {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 12px;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 20px 0;
}

/* BOTÓN */

button {
    background: #667eea;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

/* MENSAJE */

#mensaje {
    margin-top: 15px;
    font-weight: bold;
    min-height: 22px;
}

footer {
    margin-top: 25px;
    color: #888;
    font-size: 13px;
}

</style>
</head>

<body>

<div class="caja">

    <h1>🎒 WEB DE TAREAS</h1>

    <p class="descripcion">
        Accede a la web de tareas del colegio
    </p>

    <div class="codigo">
        8624
    </div>

    <p>🔑 Código de acceso</p>

    <!-- NO SOY UN ROBOT -->

    <div class="robot">

        <input
            type="checkbox"
            id="robot"
            onchange="comprobarRobot()"
        >

        <label for="robot">
            No soy un robot
        </label>

    </div>

    <button
        id="boton"
        disabled
        onclick="abrirWeb()"
    >
        🚀 ABRIR WEB DE TAREAS
    </button>

    <div id="mensaje"></div>

    <footer>
        © 2026 - Web de Tareas
    </footer>

</div>

<script>

function comprobarRobot() {

    const robot = document.getElementById("robot");
    const boton = document.getElementById("boton");
    const mensaje = document.getElementById("mensaje");

    if (robot.checked) {

        boton.disabled = false;

        mensaje.innerHTML = "✅ Verificación completada";
        mensaje.style.color = "green";

    } else {

        boton.disabled = true;

        mensaje.innerHTML = "";

    }
}

function abrirWeb() {

    window.open(
        "https://tareas-adrimaker.netlify.app/",
        "_blank"
    );

}

</script>

</body>
</html>
