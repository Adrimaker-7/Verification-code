<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web de Tareas</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.caja {
    background: white;
    color: #222;
    width: 90%;
    max-width: 500px;
    padding: 30px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

h1 {
    margin-top: 0;
}

.codigo {
    background: #f1f1f1;
    padding: 15px;
    border-radius: 12px;
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 5px;
    margin: 20px 0;
}

button {
    background: #667eea;
    color: white;
    border: none;
    padding: 14px 25px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

a {
    text-decoration: none;
    color: white;
}
</style>
</head>

<body>

<div class="caja">

    <h1>🎒 WEB DE TAREAS</h1>

    <p>Accede a la web de tareas del colegio</p>

    <div class="codigo">
        8624
    </div>

    <p>🔑 Código de acceso</p>

    <a href="https://tareas-adrimaker.netlify.app/" target="_blank">
        <button>🚀 ABRIR WEB DE TAREAS</button>
    </a>

</div>

</body>
</html>
